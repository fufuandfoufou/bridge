# Pushing a v* tag builds, signs, notarizes and publishes the macOS app.
# Without signing secrets the job only runs the tests and skips publishing, so
# unsigned releases uploaded by hand don't show up as failed runs. It never
# publishes anything unsigned. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -count=1

      - name: Check signing secrets
        id: secrets
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          if [ -n "$CERT_BASE64" ] && [ -n "$SIGN_IDENTITY" ] && [ -n "$NOTARY_KEY_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set, so nothing is built or published. Upload unsigned builds by hand."
          fi

      - name: Import signing certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          test -n "$CERT_BASE64" || { echo "::error::MACOS_CERT_P12_BASE64 is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        if: steps.secrets.outputs.ready == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$SIGN_IDENTITY" && test -n "$NOTARY_KEY_BASE64" || { echo "::error::signing secrets are not set"; exit 1; }
          export NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_FILE"
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Publish
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --verify-tag --generate-notes --title "Bridge $GITHUB_REF_NAME"

      - name: Remove signing keychain
        if: always() && steps.secrets.outputs.ready == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
